<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Special Invite from Idha | The P Story</title>
    <meta
      name="description"
      content="Play a special invitation from little Idha, then open Prerna &amp; Parth’s wedding invitation."
    />
    <link rel="canonical" href="https://thepstory.netlify.app/" />
    <meta name="theme-color" content="#FFF9EF" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thepstory.netlify.app/" />
    <meta property="og:title" content="A Special Invite from Idha | The P Story" />
    <meta
      property="og:description"
      content="Play to hear a special invite from our little Idha, then explore the wedding invitation."
    />
    <meta property="og:image" content="https://thepstory.netlify.app/images/og-share.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="images/ornaments/feather.svg" type="image/svg+xml" />
  </head>
  <body class="page-landing">
    <div class="ambient" aria-hidden="true">
      <div class="petal-drift" id="petal-drift"></div>
    </div>

    <header class="site-nav is-scrolled" id="site-nav">
      <a class="site-nav__brand" href="/">
        <img src="images/ornaments/feather.svg" alt="" width="18" height="36" />
        <span>The P Story</span>
      </a>
      <nav class="site-nav__links" id="primary-nav" aria-label="Primary">
        <a href="/invite/">Invitation</a>
        <a href="/rsvp.html" class="site-nav__rsvp">RSVP</a>
      </nav>
    </header>

    <main class="landing">
      <section class="landing__card" aria-label="Special invite from Idha">
        <button class="landing__unlock is-visible" type="button" id="idha-unlock" aria-label="Tap to hear Idha">
          <span class="landing__unlock-eyebrow">A little voice</span>
          <span class="landing__unlock-title">Tap to hear Idha</span>
        </button>

        <div class="landing__canopy" aria-hidden="true">
          <picture>
            <source srcset="images/ornaments/wisteria-canopy.webp" type="image/webp" />
            <img
              src="images/ornaments/wisteria-canopy.png"
              alt=""
              width="1200"
              height="420"
            />
          </picture>
        </div>

        <div class="landing__body">
          <h1 class="landing__title">A Special Invite from Our Little Idha</h1>

          <div class="landing__player">
            <button class="landing__play" type="button" id="idha-play" aria-label="Play Idha’s message">
              Play Message
            </button>
            <audio
              id="idha-audio"
              src="/assets/audio/idha-invite.m4a"
              preload="auto"
              playsinline
              webkit-playsinline
            ></audio>
          </div>

          <figure class="landing__portrait">
            <picture>
              <source srcset="images/idha-couple-kids.webp" type="image/webp" />
              <img
                src="images/idha-couple-kids.jpg"
                alt="Prerna and Parth as children in wedding attire"
                width="692"
                height="1024"
                loading="eager"
              />
            </picture>
          </figure>

          <img class="ornamental-divider" src="images/ornaments/divider.svg" alt="" />

          <section class="landing__cta" aria-label="Open wedding invitation">
            <p class="landing__save-date">Save the Date</p>
            <p class="landing__date">12 December 2026</p>
            <p class="landing__tagline">Two hearts, one forever</p>
            <a class="wedding-button wedding-button--primary" href="/invite/">Go to Invite</a>
          </section>
        </div>
      </section>
    </main>

    <script src="js/wedding-config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
